apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-backend
  namespace: reservas
  labels:
    app: reservas-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reservas-backend
  template:
    metadata:
      labels:
        app: reservas-backend
    spec:
      containers:
        - name: reservas-backend
          image: reservas-backend:sprint3-obs
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: reservas-backend-config
            - secretRef:
                name: reservas-backend-secret
          readinessProbe:
            httpGet:
              path: /api/v1/public/status
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/public/status
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: reservas-backend-service
  namespace: reservas
  labels:
    app: reservas-backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/actuator/prometheus"
    prometheus.io/port: "8080"
spec:
  type: NodePort
  selector:
    app: reservas-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
